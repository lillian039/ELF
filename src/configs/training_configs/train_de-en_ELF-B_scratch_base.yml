# From-scratch De-En, ARM A (control): geometry router OFF.
# Identical to arm B (train_de-en_ELF-B_scratch_geom.yml) except the router
# fields. 10-epoch pilot; raise `epochs` and relaunch to extend (auto-resume).
# Dataset (local copies; see download_train_data.sh)
data_path: "ckpts/wmt14_de-en_train_t5"
eval_data_path: "ckpts/wmt14_de-en_validation_t5"
max_length: 128
max_input_length: 64
pad_token: eos

# Encoder
encoder_model_name: t5-small
latent_mean: 0.0
latent_std: 0.2

# Model architecture
model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

# Denoiser objective
denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: "logit_normal"

# Decoder objective
decoder_prob: 0.2
decoder_noise_scale: 1.0
decoder_p_mean: 0.8
decoder_p_std: 0.8

# Conditioning / CFG
label_drop_prob: 0.1
self_cond_prob: 0.5

# Training (optimizer + schedule)
epochs: 5
global_batch_size: 512
blr: 0.001
weight_decay: 0.0
warmup_steps: 5000
optimizer: muon
gradient_checkpointing: true
use_bf16: true

# EMA
ema_decay1: 0.9999

# Sampling (in-training generation eval kept cheap; full eval via eval.py)
sampling_configs_path: "src/configs/sampling_configs/cond_sampling_configs.yml"
num_samples: 256

# Logging & Checkpointing
log_freq: 100
save_freq: 1
eval_freq: 5

# Output
output_dir: "outputs/scratch_deen_base"
hf_repo_id: null
resume: null

# Wandb
use_wandb: false
wandb_project: elf
wandb_entity: null
wandb_run_name: scratch_deen_base

# Misc
seed: 0
